<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTMS — Páginas legales</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: #1a1a1a;
  background: #f7f9f8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}
.card {
  max-width: 520px;
  width: 100%;
  background: #fff;
  border-radius: 12px;
  padding: 2.5rem 2rem;
  box-shadow: 0 4px 24px rgba(29, 107, 62, 0.08);
}
h1 { font-size: 24px; font-weight: 700; color: #1d6b3e; margin-bottom: 0.4rem; }
.sub { font-size: 13px; color: #888; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 2px solid #e8f5ee; }
ul { list-style: none; }
li { margin-bottom: 0.5rem; }
a {
  display: block;
  padding: 14px 16px;
  background: #f0faf5;
  border-radius: 8px;
  color: #1d6b3e;
  text-decoration: none;
  font-weight: 600;
  border-left: 3px solid #1d6b3e;
  transition: background 0.15s;
}
a:hover { background: #e0f3e9; }
.meta { font-size: 12px; color: #666; font-weight: 400; margin-top: 4px; }
.footer { font-size: 12px; color: #888; margin-top: 1.5rem; text-align: center; }
.footer a { display: inline; padding: 0; background: none; border: none; color: #1d6b3e; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>RTMS — Páginas legales</h1>
  <p class="sub">Rugby Team Manager System</p>

  <ul>
    <li>
      <a href="./privacy.html">
        Política de Privacidad
        <span class="meta">Cómo recopilamos y tratamos tus datos personales</span>
      </a>
    </li>
  </ul>

  <p class="footer">Contacto: <a href="mailto:rtms@ldg.com.ar">rtms@ldg.com.ar</a></p>
</div>
</body>
</html>
